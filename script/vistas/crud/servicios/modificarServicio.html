<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modificar servicio — Admin</title>
  <link rel="stylesheet" href="../style/admin.css" />
</head>
<body>

  <nav class="admin-nav">
    <a class="nav-brand" href="../index.html">Admin — Consultorio</a>
    <ul>
      <li><a href="index.html">Servicios</a></li>
    </ul>
  </nav>

  <main class="admin-main">
    <h2>Modificar servicio</h2>

    <div class="alert alert-success" style="display:none;" id="msg-exito">
      Servicio modificado con éxito.
    </div>
    <div class="alert alert-error" style="display:none;" id="msg-error">
      Error al modificar el servicio. Revisá los datos e intentá de nuevo.
    </div>

    <form class="admin-form" id="form-modificar" enctype="multipart/form-data">

      <!-- El id del servicio se pasará por querystring (?id=...) y se cargará con JS -->
      <input type="hidden" id="id" name="id" />

      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          maxlength="150"
          required
        />
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción</label>
        <textarea
          id="descripcion"
          name="descripcion"
          maxlength="255"
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label for="imagen">Imagen actual</label>
        <!-- Se mostrará la imagen actual cuando se cargue el servicio con JS -->
        <img id="imagen-preview" src="" alt="" style="display:none; max-width:200px; border-radius:8px; margin-bottom:8px;" />
        <label for="imagen-nueva">Reemplazar imagen (opcional)</label>
        <input
          type="file"
          id="imagen-nueva"
          name="imagen"
          accept="image/*"
        />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-editar">Guardar cambios</button>
        <a class="btn btn-cancelar" href="index.html">Cancelar</a>
      </div>

    </form>
  </main>


<script>
  const params   = new URLSearchParams(window.location.search)
  const id       = params.get('id')
  const msgExito = document.getElementById('msg-exito')
  const msgError = document.getElementById('msg-error')

  async function cargarServicio() {
    try {
      const res = await fetch(`/api-crud/servicios/${id}`)
      const s   = await res.json()
      document.getElementById('nombre').value      = s.nombre
      document.getElementById('descripcion').value = s.descripcion
      if (s.imagen) {
        const preview  = document.getElementById('imagen-preview')
        preview.src    = `/imagenes/${s.imagen}`
        preview.style.display = 'block'
      }
    } catch {
      msgError.style.display = 'block'
    }
  }

  document.getElementById('form-modificar').addEventListener('submit', async (e) => {
    e.preventDefault()
    try {
      const res = await fetch(`/api-crud/servicios/${id}`, { method: 'PUT', body: new FormData(e.target) })
      if (res.ok) {
        msgExito.style.display = 'block'
        setTimeout(() => { msgExito.style.display = 'none' }, 3000)
      } else {
        msgError.style.display = 'block'
        setTimeout(() => { msgError.style.display = 'none' }, 3000)
      }
    } catch {
      msgError.style.display = 'block'
      setTimeout(() => { msgError.style.display = 'none' }, 3000)
    }
  })

  cargarServicio()
</script>
</body>
</html>
