<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modificar servicio — Admin</title>
  <link rel="stylesheet" href="../style/admin.css" />
</head>
<body>

  <nav class="admin-nav">
    <a class="nav-brand" href="../index.html">Admin — Consultorio</a>
    <ul>
      <li><a href="index.html">Servicios</a></li>
      <li><span class="nav-usuario" id="nav-usuario"></span></li>
      <li><button class="btn-nav-logout" id="btn-logout">Cerrar sesión</button></li>
    </ul>
  </nav>

  <main class="admin-main">
    <h2>Modificar servicio</h2>

    <div class="alert alert-error" style="display:none;" id="msg-sin-sesion">
      Sesión no válida. <a href="../index.html">Iniciá sesión desde el panel principal.</a>
    </div>

    <div class="alert alert-success" style="display:none;" id="msg-exito">
      Servicio modificado con éxito.
    </div>
    <div class="alert alert-error" style="display:none;" id="msg-error">
      Error al modificar el servicio. Revisá los datos e intentá de nuevo.
    </div>

    <form class="admin-form" id="form-modificar" enctype="multipart/form-data">

      <input type="hidden" id="id" name="id" />

      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          maxlength="150"
          required
        />
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción</label>
        <textarea
          id="descripcion"
          name="descripcion"
          maxlength="255"
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label for="imagen">Imagen actual</label>
        <img id="imagen-preview" src="" alt="" style="display:none; max-width:200px; border-radius:8px; margin-bottom:8px;" />
        <label for="imagen-nueva">Reemplazar imagen (opcional)</label>
        <input
          type="file"
          id="imagen-nueva"
          name="imagen"
          accept="image/*"
        />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-editar">Guardar cambios</button>
        <a class="btn btn-cancelar" href="index.html">Cancelar</a>
      </div>

    </form>
  </main>


<script>
  const params       = new URLSearchParams(window.location.search)
  const id           = params.get('id')
  const msgExito     = document.getElementById('msg-exito')
  const msgError     = document.getElementById('msg-error')
  const msgSinSesion = document.getElementById('msg-sin-sesion')

  async function cargarServicio() {
    try {
      const res = await fetch(`/api-crud/servicios/${id}`)
      const s   = await res.json()
      document.getElementById('nombre').value      = s.nombre
      document.getElementById('descripcion').value = s.descripcion
      if (s.imagen) {
        const preview  = document.getElementById('imagen-preview')
        preview.src    = `/imagenes/${s.imagen}`
        preview.style.display = 'block'
      }
    } catch {
      msgError.style.display = 'block'
    }
  }

  document.getElementById('form-modificar').addEventListener('submit', async (e) => {
    e.preventDefault()
    try {
      const res = await fetch(`/api-crud/servicios/${id}`, { method: 'PUT', body: new FormData(e.target) })
      if (res.status === 401) {
        msgSinSesion.style.display = 'block'
        return
      }
      if (res.ok) {
        msgExito.style.display = 'block'
        setTimeout(() => { msgExito.style.display = 'none' }, 3000)
      } else {
        msgError.style.display = 'block'
        setTimeout(() => { msgError.style.display = 'none' }, 3000)
      }
    } catch {
      msgError.style.display = 'block'
      setTimeout(() => { msgError.style.display = 'none' }, 3000)
    }
  })

  // Logout
  document.getElementById('btn-logout').addEventListener('click', async () => {
    try { await fetch('/api-crud/auth/logout', { method: 'POST' }) } catch {}
    document.querySelector('.admin-main').innerHTML =
      '<div class="alert alert-success">Sesión cerrada. <a href="../index.html">Volvé al panel de acceso.</a></div>'
  })

  // Muestra nombre de usuario si hay sesión
  fetch('/api-crud/auth/verificar')
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (data) document.getElementById('nav-usuario').textContent = data.usuario
      else msgSinSesion.style.display = 'block'
    })
    .catch(() => {})

  cargarServicio()
</script>
</body>
</html>
