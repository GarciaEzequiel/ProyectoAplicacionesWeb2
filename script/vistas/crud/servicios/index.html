<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servicios — Admin</title>
  <link rel="stylesheet" href="../style/admin.css" />
</head>
<body>

  <nav class="admin-nav">
    <a class="nav-brand" href="../index.html">Admin — Consultorio</a>
    <ul>
      <li><a href="index.html" class="active">Servicios</a></li>
    </ul>
  </nav>

  <main class="admin-main">

    <div class="alert alert-success" style="display:none;" id="msg-exito">
      Operación realizada con éxito.
    </div>
    <div class="alert alert-error" style="display:none;" id="msg-error">
      Ocurrió un error. Intentá de nuevo.
    </div>

    <div class="table-toolbar">
      <h2>Servicios</h2>
      <a class="btn btn-agregar" href="altaServicio.html">+ Agregar servicio</a>
    </div>

    <div class="admin-table-wrapper">
      <table class="admin-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Imagen</th>
            <th class="col-acciones">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-servicios">
          <!-- Las filas se generarán dinámicamente con JS -->
          <tr>
            <td colspan="5" style="text-align:center; color:#a39b8b;">
              Cargando servicios…
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>


<script>
  const tbody    = document.getElementById('tabla-servicios')
  const msgExito = document.getElementById('msg-exito')
  const msgError = document.getElementById('msg-error')

  function mostrar(el) {
    el.style.display = 'block'
    setTimeout(() => { el.style.display = 'none' }, 3000)
  }

  async function cargarServicios() {
    try {
      const res = await fetch('/api-crud/servicios')
      const servicios = await res.json()
      tbody.innerHTML = servicios.map(s => `
        <tr>
          <td>${s.id}</td>
          <td>${s.nombre}</td>
          <td>${s.descripcion}</td>
          <td>${s.imagen ? `<img src="/imagenes/${s.imagen}" alt="${s.nombre}" style="width:60px;height:60px;object-fit:cover;border-radius:4px;">` : '—'}</td>
          <td>
            <a class="btn btn-editar" href="modificarServicio.html?id=${s.id}">Editar</a>
            <button class="btn btn-eliminar" onclick="eliminar(${s.id})">Eliminar</button>
          </td>
        </tr>
      `).join('')
    } catch {
      mostrar(msgError)
    }
  }

  async function eliminar(id) {
    if (!confirm('¿Eliminar este servicio?')) return
    try {
      const res = await fetch(`/api-crud/servicios/${id}`, { method: 'DELETE' })
      if (res.ok) { mostrar(msgExito); cargarServicios() }
      else mostrar(msgError)
    } catch {
      mostrar(msgError)
    }
  }

  cargarServicios()
</script>
</body>
</html>
